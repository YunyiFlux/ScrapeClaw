[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scrapeclaw"
version = "1.0.0"
description = "Autonomous SPA Reverse-Engineering & Crawler Synthesizer Agent"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "ScrapeClaw Team" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "pydantic>=2.7.0",
    "openai>=1.30.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pyyaml>=6.0.1",
    "playwright>=1.44.0",
    "httpx>=0.27.0",
    "httpcore>=1.0.5",
    "jinja2>=3.1.4",
    "jsonpath-ng>=1.6.1",
    "tenacity>=8.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
]

[project.scripts]
scrapeclaw = "scrapeclaw.cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["scrapeclaw*"]

[project.urls]
Homepage = "https://github.com/Netw0rkNoob/ScrapeClaw"
Repository = "https://github.com/Netw0rkNoob/ScrapeClaw"
Documentation = "https://github.com/Netw0rkNoob/ScrapeClaw#readme"
Issues = "https://github.com/Netw0rkNoob/ScrapeClaw/issues"
